openapi: 3.0.3
info:
  title: NeoMarket Moderation
  version: "1.0"
  description: |
    Модуль модерации товаров.

    Логика работы:
    1. Moderation узнает, что товар создан или изменен (временный ручной enqueue).
    2. Запрашивает данные товара из B2B (если задан B2B_PRODUCT_URL_TEMPLATE).
    3. Сохраняет снимок товара. Для UPDATED допускается before/after.
    4. Модератор берет карточку из очереди и проверяет.
    5. Одобряет или блокирует; событие решения фиксируется в outbox.

paths:
  /api/v1/events/product:
    post:
      summary: Приём событий о товаре от B2B
      description: |
        Server-to-server канал от B2B-синдиката. Требуется `X-Service-Key`.
        Идемпотентность по `idempotency_key` (повтор → 200 без побочных эффектов).

        События:
        - `CREATED` — карточка в очереди `PENDING`
        - `EDITED` / `UPDATED` — обновление снимков; после решения модерации возвращает в очередь
        - `DELETED` — карточки архивируются (`ARCHIVED`), уходят из очереди
      tags: [B2B Events]
      security: []
      parameters:
        - name: X-Service-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductLifecycleEvent"
      responses:
        "200":
          description: Событие принято
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEventAccepted"
        "400":
          description: Невалидный payload
        "401":
          description: Отсутствует или неверный X-Service-Key

  /api/v1/product-moderation/get-next:
    post:
      summary: Следующая карточка из очереди
      description: |
        Выдаёт самую старую `PENDING` карточку (с учётом приоритетных очередей 1→4),
        переводит в `IN_REVIEW` и закрепляет за модератором (`SELECT FOR UPDATE SKIP LOCKED`).

        Опциональный `queue_id` (1–4): новые / после блокировки / в наличии / не в наличии.
        Если модератор уже держит активную `IN_REVIEW` (в пределах таймаута) — **409**.
        Просроченные `IN_REVIEW` возвращаются в `PENDING` автоматически.
      tags: [Queue]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetNextRequest"
      responses:
        "200":
          description: Карточка для проверки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationCard"
        "204":
          description: Очередь пуста
        "409":
          description: У модератора уже есть карточка в IN_REVIEW
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: MODERATOR_ALREADY_HAS_CARD
                  message:
                    type: string

  /api/v1/products/{id}/approve:
    post:
      summary: Одобрить товар (IN_REVIEW → MODERATED)
      description: |
        Одобряет карточку в статусе IN_REVIEW, закреплённую за текущим модератором.
        Синхронно отправляет решение MODERATED в B2B (`POST /api/v1/moderation/events`).
        Идемпотентность: `idempotency_key` = `approve:{card_id}`.
      tags: [Decisions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Товар одобрен, статус -> MODERATED
          content:
            application/json:
              schema:
                type: object
                properties:
                  product_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: MODERATED
        "403":
          description: Карточка закреплена за другим модератором
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: APPROVE_NOT_ASSIGNED
                message: Card is assigned to another moderator
        "404":
          description: Нет карточки IN_REVIEW для товара
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Нельзя одобрить (нет SKU, правки продавца во время review)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                after_edited:
                  value:
                    code: APPROVE_AFTER_EDITED
                    message: Seller edited the product during review
                without_sku:
                  value:
                    code: APPROVE_WITHOUT_SKU
                    message: Product must have at least one active SKU
        "503":
          description: B2B недоступен — карточка остаётся IN_REVIEW
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/products/{id}/decline:
    post:
      summary: Блокировка товара (soft или hard по причине)
      description: |
        Единый endpoint decline. Маршрут по `blocking_reason_id.hard_only`:
        - `hard_only=false` → мягкая блокировка (`BLOCKED`, `hard_block=false`, карточка `DECLINED`)
        - `hard_only=true` → жёсткая терминальная (`HARD_BLOCKED`, `hard_block=true`)
        Синхронная доставка в B2B. Идемпотентность: `soft-block:{card_id}` / `hard-block:{card_id}`.
        Терминальная карточка `HARD_BLOCKED` не принимает approve/enqueue/повторный decline (403).
      tags: [Decisions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineRequest"
      responses:
        "200":
          description: Товар мягко заблокирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftBlockResponse"
        "400":
          description: Невалидная причина, поле или hard_only причина
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unknown_reason:
                  value:
                    code: BLOCKING_REASON_NOT_FOUND
                    message: Blocking reason does not exist
                invalid_field:
                  value:
                    code: INVALID_FIELD_NAME
                    message: Unknown field name
                hard_only:
                  value:
                    code: HARD_REASON_REQUIRES_HARD_BLOCK
                    message: This blocking reason requires hard block endpoint
        "403":
          description: Карточка закреплена за другим модератором
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Нет карточки IN_REVIEW
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: B2B недоступен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/product-blocking-reasons:
    get:
      summary: Справочник причин блокировки (US-MOD-06)
      description: |
        Возвращает только активные причины (`is_active=true`).
        `hard_block=true` — только для жёсткой блокировки (US-MOD-05);
        `hard_block=false` — только для мягкой (US-MOD-04).
        Удаление в админке запрещено при исторических ссылках — деактивируйте.
      tags: [Reference]
      parameters:
        - name: hard_block
          in: query
          required: false
          schema:
            type: boolean
          description: Фильтр по типу блокировки (soft vs hard)
      responses:
        "200":
          description: Список активных причин
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockingReason"
        "400":
          description: Невалидный параметр hard_block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/product-moderation/enqueue:
    post:
      summary: Временный endpoint ручной постановки товара в очередь
      tags: [Queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueRequest"
      responses:
        "201":
          description: Карточка добавлена в очередь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationCard"

components:
  schemas:
    ModerationCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [CREATED, UPDATED, EDITED]
        queue_status:
          type: string
          enum: [PENDING, IN_REVIEW, APPROVED, DECLINED, HARD_BLOCKED, ARCHIVED]
        priority_queue:
          type: integer
          minimum: 1
          maximum: 4
        snapshot_before:
          type: object
          nullable: true
          additionalProperties: true
        snapshot_after:
          type: object
          additionalProperties: true
        assigned_to:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BlockingReason:
      type: object
      required: [blocking_reason_id, title, hard_block]
      properties:
        blocking_reason_id:
          type: string
          description: Стабильный id причины (slug), используется в decline
        title:
          type: string
        description:
          type: string
        hard_block:
          type: boolean
          description: true — только hard decline (US-MOD-05); false — soft (US-MOD-04)

    DeclineRequest:
      type: object
      required: [blocking_reason_id]
      properties:
        blocking_reason_id:
          type: string
          description: Код причины из справочника (US-MOD-06)
        reason_code:
          type: string
          deprecated: true
          description: Alias для blocking_reason_id
        comment:
          type: string
          maxLength: 500
        field_reports:
          type: array
          items:
            $ref: "#/components/schemas/FieldReportItem"
        fields:
          type: array
          deprecated: true
          items:
            type: string

    FieldReportItem:
      type: object
      required: [field_name]
      properties:
        field_name:
          type: string
          enum: [title, description, images, price, category, skus, characteristics, brand]
        message:
          type: string
          maxLength: 500

    SoftBlockResponse:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        status:
          type: string
          example: BLOCKED
        hard_block:
          type: boolean
          example: false
        field_reports:
          type: array
          items:
            $ref: "#/components/schemas/FieldReportItem"
        reason:
          $ref: "#/components/schemas/DeclineReason"

    ModerationBlockedEvent:
      type: object
      required: [idempotency_key, product_id, status, hard_block]
      properties:
        idempotency_key:
          type: string
          examples:
            soft: "soft-block:6ba7b810-9dad-11d1-80b4-00c04fd430c8"
            hard: "hard-block:6ba7b810-9dad-11d1-80b4-00c04fd430c8"
        product_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [BLOCKED]
        hard_block:
          type: boolean
          description: false — soft block; true — irreversible HARD_BLOCKED in B2B
        blocking_reason:
          type: object
        field_reports:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    DeclineReason:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
        comment:
          type: string
        fields:
          type: array
          items:
            type: string

    ProductLifecycleEvent:
      type: object
      required: [idempotency_key, product_id, event_type]
      properties:
        idempotency_key:
          type: string
          maxLength: 128
        product_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [CREATED, EDITED, UPDATED, DELETED]
        snapshot_before:
          type: object
          nullable: true
          additionalProperties: true
        snapshot_after:
          type: object
          nullable: true
          additionalProperties: true

    GetNextRequest:
      type: object
      properties:
        queue_id:
          type: integer
          minimum: 1
          maximum: 4
          nullable: true
          description: |
            1 — новые, 2 — исправленные после блокировки,
            3 — изменённые (в наличии), 4 — изменённые (не в наличии).
            null — автоприоритизация 1→4.

    ProductEventAccepted:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
        card_id:
          type: string
          format: uuid
          nullable: true

    ModerationDecisionEvent:
      type: object
      required: [idempotency_key, product_id, status]
      description: Исходящее событие одобрения в B2B (US-MOD-03)
      properties:
        idempotency_key:
          type: string
          maxLength: 128
          example: "approve:6ba7b810-9dad-11d1-80b4-00c04fd430c8"
        product_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [MODERATED]
        hard_block:
          type: boolean
          default: false
        blocking_reason:
          nullable: true
        field_reports:
          type: array
          items:
            type: object

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    EnqueueRequest:
      type: object
      required: [product_id, event_type]
      properties:
        product_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [CREATED, UPDATED, EDITED]
        snapshot_before:
          type: object
          additionalProperties: true
        snapshot_after:
          type: object
          additionalProperties: true
